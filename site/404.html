<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Jeremy Fabre</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1612" media="(prefers-color-scheme: dark)">
  <script>
    // Theme: a saved choice wins, otherwise the system preference, followed live.
    // Runs before the stylesheet so the first paint already carries the theme.
    (() => {
      const root = document.documentElement;
      const system = matchMedia('(prefers-color-scheme: dark)');
      const colors = { light: '#f6f0e6', dark: '#1a1612' };
      const read = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
      const save = (theme) => { try { localStorage.setItem('theme', theme); return true; } catch { return false; } };
      let choice = read();
      const apply = () => {
        const theme = choice === 'light' || choice === 'dark' ? choice : system.matches ? 'dark' : 'light';
        root.dataset.theme = theme;
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = colors[theme];
        const button = document.querySelector('.theme-toggle');
        if (!button) return;
        const label = `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`;
        button.setAttribute('aria-label', label);
        button.title = label;
      };
      apply();
      system.addEventListener('change', apply);
      addEventListener('storage', (event) => { if (event.key === 'theme') { choice = event.newValue; apply(); } });
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.theme-toggle').hidden = false;
        apply();
      });
      document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element) || !event.target.closest('.theme-toggle')) return;
        choice = root.dataset.theme === 'dark' ? 'light' : 'dark';
        save(choice);
        apply();
      });
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <main class="not-found">
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" hidden>
      <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.75 6.75 0 0 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
    <p class="ordinal" aria-hidden="true">404</p>
    <h1 class="name">Page not found</h1>
    <p class="role">There is nothing at this address.</p>
    <p class="deck">The portfolio is a single page. Everything is on the home page, including the four selected projects.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">Back to the home page</a>
    </div>
  </main>
</div>
</body>
</html>
